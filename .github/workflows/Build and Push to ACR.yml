name: Build and Push to ACR

on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  actions: read
  security-events: write
env:
  REGISTRY: poctestacr.azurecr.io
  IMAGE_NAME: mdc-mock-0001
  IMAGE_TAG: mdc-ghas-integration

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_ENDPOINT }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Push Docker image to ACR
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          
      - name: Run Microsoft Security DevOps - Container Mapping
        uses: microsoft/security-devops-action@latest
        id: msdo
        with:
          tools: container-mapping

